/* Base Styles */
body { font-family: 'Outfit', sans-serif; background: #020617; color: white; overflow: hidden; touch-action: none; user-select: none; }
.range-slider { -webkit-appearance: none; width: 100%; background: transparent; height: 6px; border-radius: 3px; background: #1e293b; }
.range-slider::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.4); cursor: pointer; border: none; margin-top: -6px;}
.doc-btn.active { background-color: rgba(0, 255, 255, 0.1); border: 1px solid #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.15); color: #00ffff; }

.doc-btn:hover:not(.active) { background: rgba(15, 23, 42, 0.9); border-color: #8b5cf6; color: #8b5cf6; }

/* Magnifier */
#magnifier { position: fixed; border-radius: 50%; border: 2px solid #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.4); pointer-events: none; z-index: 100; background: #020617; display: none; }

/* Print Styles */
@media print {
    body > *:not(#printContainer) { display: none !important; }
    #printContainer { display: block !important; position: absolute; top: 0; left: 0; width: 100%; z-index: 99999; }
    @page { margin: 0; size: auto; }
}

/* Loader */
.loader { border: 3px solid #1e293b; border-top: 3px solid #00ffff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>

<!-- OpenCV async load -->
<script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()" type="text/javascript"></script>

<script>
// --- Global State ---
let cvReady = false;
let currentSide = 'front';
let rawImageObj = null; 
let cropperPoints = [];
let draggingPointIndex = -1;
let scaleFactor = 1;
let editorZoom = 1;

let currentPrintMode = 'idcard'; // idcard, large, a4

// ID Card Config (Standard ~ 85.6mm x 54mm). Rendering at high res for sharpness.
const TARGET_W = 1011; 
const TARGET_H = 638;

let currentFilter = 'magic';
let pages = [ [] ]; // Array of pages, each containing items { id, side, src, x, y, w, h }
let activePageIndex = 0;
let isUpscale = false;

function toggleUpscale() {
    isUpscale = !isUpscale;
    const btn = document.getElementById('btnUpscale');
    btn.classList.toggle('bg-cyan-900', isUpscale);
    btn.classList.toggle('text-cyan-400', isUpscale);
    btn.classList.toggle('border-cyan-400', isUpscale);
}

function rotateCrop() {
    if (cropperPoints.length === 4) {
        const p = cropperPoints;
        cropperPoints = [p[3], p[0], p[1], p[2]];
        drawEditor();
    }
}

function addNewPage() {
    pages.push([]);
    activePageIndex = pages.length - 1;
    renderQueueList();
    renderA4();
    setTimeout(() => scrollToPage(activePageIndex), 100);
}

function setActivePage(index) {
    activePageIndex = index;
    renderQueueList();
    renderA4();
    scrollToPage(index);
}

function scrollToPage(index) {
    const pEl = document.getElementById(`pageWrap_${index}`);
    if (pEl) pEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
}

function setPrintMode(mode) {
    currentPrintMode = mode;
    ['idcard', 'large', 'a4'].forEach(m => {
        const btn = document.getElementById('btnMode' + m.charAt(0).toUpperCase() + m.slice(1));
        if (m === mode) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
    renderA4();
}

// UI Initialization
document.getElementById('singleSideMode').addEventListener('change', function(e) {
    const backBox = document.getElementById('backBox');
    if (e.target.checked) {
        backBox.style.opacity = '0.4';
        backBox.style.pointerEvents = 'none';
    } else {
        backBox.style.opacity = '1';
        backBox.style.pointerEvents = 'auto';
    }
});

// OpenCV Init Hook
function onOpenCvReady() {
    cv['onRuntimeInitialized'] = () => {
        cvReady = true;
        document.getElementById('loaderScreen').classList.add('hidden');
    };
}
// Fallback if already loaded
setTimeout(() => { if(typeof cv !== 'undefined' && cv.getBuildInformation && !cvReady) onOpenCvReady(); }, 2000);

// --- Upload Handling ---
function handleUpload(event, side) {
    if (!cvReady) return alert('Please wait for the image processing engine to load.');
    const file = event.target.files[0];
    if (!file) return;

    currentSide = side;
    const url = URL.createObjectURL(file);
    rawImageObj = new Image();
    rawImageObj.onload = () => {
        openEditor();
    };
    rawImageObj.src = url;
    // Reset input so the same file can be uploaded again if needed
    event.target.value = '';
}

// --- Editor Logic ---
const cropCanvas = document.getElementById('cropCanvas');
const ctx = cropCanvas.getContext('2d');
const magCanvas = document.getElementById('magnifier');
const ctxMag = magCanvas.getContext('2d');
const workspace = document.getElementById('editorWorkspace');

function openEditor() {
    document.getElementById('editorModal').classList.remove('hidden');
    
    // Fit image to screen workspace area
    const isMobile = window.innerWidth < 768;
    const sidebarW = isMobile ? 0 : 320;
    const sidebarH = isMobile ? window.innerHeight * 0.5 : 0;
    const padX = isMobile ? 40 : 100;
    const padY = isMobile ? 40 : 100;
    
    const maxW = window.innerWidth - sidebarW - padX;
    const maxH = window.innerHeight - sidebarH - padY;
    
    scaleFactor = Math.min(Math.max(10, maxW) / rawImageObj.width, Math.max(10, maxH) / rawImageObj.height);
    if (scaleFactor > 1) scaleFactor = 1; // Prevent upscale blurring
    
    cropCanvas.width = rawImageObj.width * scaleFactor;
    cropCanvas.height = rawImageObj.height * scaleFactor;
    
    // Initialize 4 perspective points
    const padding = 20;
    const w = cropCanvas.width;
    const h = cropCanvas.height;
    cropperPoints = [
        {x: padding, y: padding}, // Top-Left
        {x: w - padding, y: padding}, // Top-Right
        {x: w - padding, y: h - padding}, // Bottom-Right
        {x: padding, y: h - padding} // Bottom-Left
    ];
    
    editorZoom = 1;
    applyEditorZoom();
    setFilter('magic'); // Automatically apply magic filter on open
}

function closeEditor() {
    document.getElementById('editorModal').classList.add('hidden');
    rawImageObj = null;
}

function zoomEditor(factor) {
    editorZoom *= factor;
    // Clamp zoom
    if(editorZoom < 0.5) editorZoom = 0.5;
    if(editorZoom > 3.0) editorZoom = 3.0;
    applyEditorZoom();
}

function applyEditorZoom() {
    cropCanvas.style.transform = `scale(${editorZoom})`;
    document.getElementById('zoomLabel').innerText = Math.round(editorZoom * 100) + '%';
}

// --- Drag & Drop Interactivity ---
function getMousePos(e) {
    const rect = cropCanvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    if(e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }
    // Calculate position considering scale factor and zoom
    return {
        x: (clientX - rect.left) / editorZoom,
        y: (clientY - rect.top) / editorZoom
    };
}

cropCanvas.addEventListener('mousedown', startDrag);
cropCanvas.addEventListener('touchstart', startDrag, {passive: false});

workspace.addEventListener('mousemove', drag);
workspace.addEventListener('touchmove', drag, {passive: false});

window.addEventListener('mouseup', endDrag);
window.addEventListener('touchend', endDrag);

function startDrag(e) {
    e.preventDefault();
    const pos = getMousePos(e);
    // Find the closest point within a 30px hit radius
    let minDist = 30; 
    draggingPointIndex = -1;
    cropperPoints.forEach((p, i) => {
        const dist = Math.hypot(p.x - pos.x, p.y - pos.y);
        if(dist < minDist) {
            minDist = dist;
            draggingPointIndex = i;
        }
    });
}

function drag(e) {
    if (draggingPointIndex === -1) {
        magCanvas.style.display = 'none';
        return;
    }
    e.preventDefault();
    const pos = getMousePos(e);
    
    // Constrain point to canvas bounds
    pos.x = Math.max(0, Math.min(cropCanvas.width, pos.x));
    pos.y = Math.max(0, Math.min(cropCanvas.height, pos.y));
    
    cropperPoints[draggingPointIndex] = pos;
    drawEditor();
    
    // Magnifier Logic
    magCanvas.style.display = 'block';
    
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    // Position magnifier near cursor but offset
    let magX = clientX - 90; 
    let magY = clientY - 220; 
    if(magY < 10) magY = clientY + 40; // Flip below if off-screen top
    
    magCanvas.style.left = magX + 'px';
    magCanvas.style.top = magY + 'px';
    
    updateMagnifier(pos.x, pos.y);
}

function endDrag() {
    draggingPointIndex = -1;
    magCanvas.style.display = 'none';
}

function drawEditor() {
    ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
    ctx.drawImage(rawImageObj, 0, 0, cropCanvas.width, cropCanvas.height);
    
    // Draw cropping polygon
    ctx.beginPath();
    ctx.moveTo(cropperPoints[0].x, cropperPoints[0].y);
    ctx.lineTo(cropperPoints[1].x, cropperPoints[1].y);
    ctx.lineTo(cropperPoints[2].x, cropperPoints[2].y);
    ctx.lineTo(cropperPoints[3].x, cropperPoints[3].y);
    ctx.closePath();
    
    // Shade outside area
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fill("evenodd"); 
    
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#00ffff"; 
    ctx.stroke();
    
    // Draw draggable corner anchors
    cropperPoints.forEach((p) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#020617";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#00ffff";
        ctx.stroke();
    });
}

function updateMagnifier(x, y) {
    const r = 90; // magnifier radius
    ctxMag.clearRect(0, 0, 180, 180);
    
    // Zoom factor
    const s = 2; 
    const sw = 180 / s;
    const sh = 180 / s;
    const sx = x - sw / 2;
    const sy = y - sh / 2;
    
    // Circular clip
    ctxMag.save();
    ctxMag.beginPath();
    ctxMag.arc(r, r, r, 0, Math.PI * 2);
    ctxMag.clip();
    
    ctxMag.drawImage(cropCanvas, sx, sy, sw, sh, 0, 0, 180, 180);
    
    // Crosshair
    ctxMag.beginPath();
    ctxMag.moveTo(r, r - 20); ctxMag.lineTo(r, r + 20);
    ctxMag.moveTo(r - 20, r); ctxMag.lineTo(r + 20, r);
    ctxMag.lineWidth = 2;
    ctxMag.strokeStyle = "#2563eb";
    ctxMag.stroke();
    ctxMag.restore();
}

// --- Right Sidebar Filters ---
function setFilter(type) {
    currentFilter = type;
    const defaultClasses = "flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-colors bg-transparent";
    const magicActiveClasses = "flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-900 bg-cyan-400 shadow-[0_0_10px_rgba(0,255,255,0.4)] transition-colors";

    document.getElementById('filterOrig').className = defaultClasses;

function updateFilters() {
    let b = document.getElementById('inpBright').value;
    let c = document.getElementById('inpContrast').value;
    document.getElementById('valBright').innerText = b;
    document.getElementById('valContrast').innerText = c;
    
    // Apply CSS filters to the canvas element for live preview
    let filterString = `brightness(${100 + parseInt(b)}%) contrast(${100 + parseInt(c)}%)`;
    if(currentFilter === 'magic') filterString += ` saturate(120%) drop-shadow(0 0 0px #000)`; 
    if(currentFilter === 'bw') filterString += ` grayscale(100%)`;
    
    cropCanvas.style.filter = filterString;
    drawEditor(); // Redraw context
}

// --- Perspective Transform & Rendering ---
function confirmScan() {
    if(!cvReady) return;

    // Convert canvas coordinates back to original image scale
    const srcCoords = cropperPoints.map(p => ({
        x: p.x / scaleFactor,
        y: p.y / scaleFactor
    }));

    // Calculate crop aspect ratio
    const cropW = Math.max(
        Math.hypot(srcCoords[1].x - srcCoords[0].x, srcCoords[1].y - srcCoords[0].y),
        Math.hypot(srcCoords[2].x - srcCoords[3].x, srcCoords[2].y - srcCoords[3].y)
    );
    const cropH = Math.max(
        Math.hypot(srcCoords[3].x - srcCoords[0].x, srcCoords[3].y - srcCoords[0].y),
        Math.hypot(srcCoords[2].x - srcCoords[1].x, srcCoords[2].y - srcCoords[1].y)
    );
    
    let outW = TARGET_W;
    let outH = TARGET_H;
    
    if (currentPrintMode !== 'idcard') {
        const maxOut = isUpscale ? 3000 : 1500;
        if (cropW > cropH) {
            outW = maxOut;
            outH = (cropH / cropW) * maxOut;
        } else {
            outH = maxOut;
            outW = (cropW / cropH) * maxOut;
        }
    } else if (isUpscale) {
        outW *= 2;
        outH *= 2;
    }

    // Perform OpenCV Transform
    const src = cv.imread(rawImageObj);
    const dst = new cv.Mat();

    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
        srcCoords[0].x, srcCoords[0].y, 
        srcCoords[1].x, srcCoords[1].y, 
        srcCoords[2].x, srcCoords[2].y, 
        srcCoords[3].x, srcCoords[3].y
    ]);
    
    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
        0, 0, 
        outW, 0, 
        outW, outH, 
        0, outH
    ]);

    let M = cv.getPerspectiveTransform(srcTri, dstTri);
    let dsize = new cv.Size(outW, outH);
    cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

    src.delete(); srcTri.delete(); dstTri.delete(); M.delete();

    // Render warped image to a temporary canvas to apply visual filters permanently
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = outW;
    tempCanvas.height = outH;
    cv.imshow(tempCanvas, dst);
    dst.delete(); 

    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = outW;
    finalCanvas.height = outH;
    const fCtx = finalCanvas.getContext('2d');
    
    let b = document.getElementById('inpBright').value;
    let c = document.getElementById('inpContrast').value;
    let filterString = `brightness(${100 + parseInt(b)}%) contrast(${100 + parseInt(c)}%)`;
    if(currentFilter === 'magic') filterString += ` saturate(120%) drop-shadow(0 0 0px #000)`;
    if(currentFilter === 'bw') filterString += ` grayscale(100%)`;
    
    fCtx.filter = filterString;
    fCtx.drawImage(tempCanvas, 0, 0);

    const dataUrl = finalCanvas.toDataURL('image/jpeg', 1.0);

    // Initial sizes and coords
    let x = 10, y = 10, defW = 85.6, defH = 54;
    if (currentPrintMode !== 'idcard') {
        const aspect = outW / outH;
        defW = currentPrintMode === 'a4' ? 180 : 100;
        defH = defW / aspect;
        x = (210 - defW) / 2;
        y = (297 - defH) / 2;
    }

    // Add to processing queue
    addToQueue(currentSide, dataUrl, x, y, defW, defH);
    
    closeEditor();
}

// --- Queue & A4 Layout Management ---
function addToQueue(side, dataUrl, x=10, y=10, w=85.6, h=54) {
    pages[activePageIndex].push({ id: Date.now(), side, src: dataUrl, x, y, w, h });
    
    // Update thumbnail indicator
    const thumb = side === 'front' ? document.getElementById('thumbFront') : document.getElementById('thumbBack');
    thumb.src = dataUrl;
    thumb.classList.remove('hidden');

    renderQueueList();
    renderA4();
}

function clearCurrent() {
    document.getElementById('thumbFront').classList.add('hidden');
    document.getElementById('thumbBack').classList.add('hidden');
}

function resetAll() {
    if(confirm("Clear all pages?")) {
        pages = [ [] ];
        activePageIndex = 0;
        clearCurrent();
        renderQueueList();
        renderA4();
    }
}

function remItem(id) {
    pages[activePageIndex] = pages[activePageIndex].filter(item => item.id !== id);
    renderQueueList();
    renderA4();
}

function renderQueueList() {
    const list = document.getElementById('queueList');
    const lbl = document.getElementById('lblQueue');
    if(lbl) lbl.innerText = `Page ${activePageIndex + 1} Items`;
    
    const pageItems = pages[activePageIndex];
    if (pageItems.length === 0) {
        list.innerHTML = `<p class="text-[10px] text-slate-500 text-center py-4" id="emptyQueueMsg">Page Empty</p>`;
        return;
    }

    list.innerHTML = '';
    pageItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "flex justify-between p-2 bg-slate-800/50 border border-slate-700 rounded items-center shadow-sm mb-1";
        div.innerHTML = `
            <span class="text-xs font-bold text-slate-300">#${index + 1} ${item.side === 'front' ? 'ID Front' : 'ID Back'}</span>
            <button onclick="remItem(${item.id})" class="w-6 h-6 flex items-center justify-center text-red-400 hover:bg-red-500/20 rounded transition-colors">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        `;
        list.appendChild(div);
    });
}

                                <button title="Rotate 90° (Portrait/Landscape)" onpointerdown="(function(e){ e.preventDefault(); e.stopPropagation(); rotateItem(${item.id}, ${pIndex}); })(event)" class="text-slate-300 hover:text-cyan-400 text-xs font-bold flex items-center gap-1 transition-colors"><i class="fa-solid fa-rotate-right"></i> Rotate</button>

function startItemDrag(e, id, pIndex) {
    if (pIndex !== activePageIndex) return;
    e.preventDefault();
    const item = pages[pIndex].find(i => i.id === id);
    activeItemDrag = { item, startX: e.clientX, startY: e.clientY, initX: item.x, initY: item.y };
}

function startItemResize(e, id, pIndex, direction) {
    if (pIndex !== activePageIndex) return;
    e.preventDefault(); e.stopPropagation();
    const item = pages[pIndex].find(i => i.id === id);
    activeItemResize = { item, startX: e.clientX, startY: e.clientY, initX: item.x, initY: item.y, initW: item.w, initH: item.h, direction, aspect: item.w / item.h };
}

function rotateItem(id, pIndex) {
    const item = pages[pIndex].find(i => i.id === id);
    if(!item) return;

    const img = new Image();
    img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.height;
        canvas.height = img.width;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        
        item.src = canvas.toDataURL('image/jpeg', 1.0);
        
        const oldW = item.w;
        const oldH = item.h;
        item.w = oldH;
        item.h = oldW;
        
        item.x = item.x + (oldW - item.w) / 2;
        item.y = item.y + (oldH - item.h) / 2;
        
        renderA4();
    };
    img.src = item.src;
}

// Global handlers for dragging items
document.addEventListener('pointermove', (e) => {
    if (!activeItemDrag && !activeItemResize) return;
    
    const a4 = document.querySelector('.a4-preview');
    if (!a4) return;
    const scaleStr = a4.style.transform.match(/scale\(([^)]+)\)/);
    const scale = scaleStr ? parseFloat(scaleStr[1]) : 1;
    const mmPerPx = 1 / (3.779527559 * scale);

    if (activeItemDrag) {
        const dx = (e.clientX - activeItemDrag.startX) * mmPerPx;
        const dy = (e.clientY - activeItemDrag.startY) * mmPerPx;
        activeItemDrag.item.x = activeItemDrag.initX + dx;
        activeItemDrag.item.y = activeItemDrag.initY + dy;
        const el = document.getElementById(`qitem_${activeItemDrag.item.id}`);
        if(el) {
            el.style.left = `${activeItemDrag.item.x}mm`;
            el.style.top = `${activeItemDrag.item.y}mm`;
        }
    }
    
    if (activeItemResize) {
        const dx = (e.clientX - activeItemResize.startX) * mmPerPx;
        const dy = (e.clientY - activeItemResize.startY) * mmPerPx;
        
        let dir = activeItemResize.direction;
        let { item, initX, initY, initW, initH, aspect } = activeItemResize;
        
        if (dir) {
            if (dir.includes('e')) {
                item.w = Math.max(10, initW + dx);
            }
            if (dir.includes('s')) {
                item.h = Math.max(10, initH + dy);
            }
            if (dir.includes('w')) {
                let newW = initW - dx;
                if (newW >= 10) {
                    item.w = newW;
                    item.x = initX + dx;
                }
            }
            if (dir.includes('n')) {
                let newH = initH - dy;
                if (newH >= 10) {
                    item.h = newH;
                    item.y = initY + dy;
                }
            }
        } else {
            let newW = initW + dx;
            if (newW < 10) newW = 10;
            item.w = newW;
            item.h = newW / aspect;
        }
        
        const el = document.getElementById(`qitem_${item.id}`);
        if(el) {
            el.style.left = `${item.x}mm`;
            el.style.top = `${item.y}mm`;
            el.style.width = `${item.w}mm`;
            el.style.height = `${item.h}mm`;
        }
    }
});

document.addEventListener('pointerup', () => {
    if (activeItemDrag || activeItemResize) {
        activeItemDrag = null;
        activeItemResize = null;
        renderA4(); // Update print mirror
    }
});

// --- Export Functions ---
function printSheet() {
    if(pages.flat().length === 0) return alert("No documents to print.");
    window.print();
}

function saveJPG() {
    if(pages.flat().length === 0) return alert("No documents to save.");
    
    pages.forEach((pageItems, pIndex) => {
        if(pageItems.length === 0) return;
        
        const canvas = document.createElement('canvas');
        canvas.width = 2480;
        canvas.height = 3508;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let startX = 170; 
        let startY = 177; 
        let x = startX;
        let y = startY;
        
        const draws = pageItems.map((item, i) => {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    if (currentPrintMode === 'idcard') {
                        ctx.drawImage(img, x, y, TARGET_W, TARGET_H);
                        if (i % 2 === 0) {
                            x += TARGET_W + 118; 
                        } else {
                            x = startX;
                            y += TARGET_H + 118; 
                        }
                    } else {
                        // Absolute positioning
                        ctx.drawImage(img, item.x * 11.811, item.y * 11.811, item.w * 11.811, item.h * 11.811);
                    }
                    resolve();
                };
                img.src = item.src;
            });
        });

        Promise.all(draws).then(() => {
            const link = document.createElement('a');
            link.download = `RCC_Print_Page_${pIndex + 1}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 1.0); 
            link.click();
        });
    });
}

function savePDF() {
    if(pages.flat().length === 0) return alert("No documents to save.");
    if (!window.jspdf) return alert("jsPDF is still loading...");
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    
    pages.forEach((pageItems, pIndex) => {
        if (pIndex > 0) doc.addPage();
        
        let startX = 14.4; 
        let startY = 15;   
        let gapX = 10;
        let gapY = 10;
        
        let x = startX;
        let y = startY;
        
        pageItems.forEach((item, i) => {
            if (currentPrintMode === 'idcard') {
                doc.addImage(item.src, 'JPEG', x, y, 85.6, 54);
                if (i % 2 === 0) {
                    x += 85.6 + gapX; 
                } else {
                    x = startX;
                    y += 54 + gapY;
                }
            } else {
                doc.addImage(item.src, 'JPEG', item.x, item.y, item.w, item.h);
            }
        });
    });
    
    doc.save('RCC_Print_Document.pdf');
}

// --- Dynamic A4 Preview Scaling ---
function resizeA4() {
    const main = document.getElementById('mainArea');
    if (!main) return;
    
    const a4W = 793.7;
    const a4H = 1122.5;
    
    const padding = 80;
    const availableW = main.clientWidth - padding;
    const availableH = main.clientHeight - padding;
    
    let scale = Math.min(availableW / a4W, availableH / a4H);
    if (scale > 1.2) scale = 1.2;
    
    document.querySelectorAll('.a4-wrapper').forEach(wrapper => {
        wrapper.style.width = `${a4W * scale}px`;
        wrapper.style.height = `${a4H * scale}px`;
    });
    
    document.querySelectorAll('.a4-preview').forEach(a4 => {
        a4.style.transform = `scale(${scale})`;
    });
}

// Resize event listeners
window.addEventListener('resize', resizeA4);
document.addEventListener('DOMContentLoaded', resizeA4);
// Initial execution with slight delay to ensure layout is ready
setTimeout(resizeA4, 100);
</script>
